name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Lets `cross-compile` produce binaries on demand without cutting a tag.
  workflow_dispatch:

jobs:
  # Run vet and tests on the host platform.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./... -count=1 -timeout 5m

  # The gates CLAUDE.md calls mandatory after any engine change. `go test`
  # does NOT cover them: the rule corpora are executable documentation
  # (`ipmdev-layout-rule` fences in docs/dev/layout-gen/*.md, extracted to
  # tests/layout-gen-rules/*.dsl), the invariant sweep is a ratchet over
  # generated layouts, and the two --check modes assert that committed
  # generated artifacts still match the sources they came from. Without these
  # a PR can be green while a fixture corpus is broken or the tracked SVGs and
  # doc fixtures have silently drifted from the docs that generate them.
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Layout fitness — base + ext corpora
        run: make layout-fitness
      - name: Universal-invariant ratchet
        # Fails if any file's finding count grows vs tests/layout-check-baseline.txt.
        run: make layout-check
      - name: Fixtures match their source docs
        # Read-only: the extractor's --check mode, not the rewriting one.
        run: go run ./cmd-dev/sync-test-cases --check
      - name: Committed diagrams match their ipmt sources
        run: go run ./cmd/md-embed --root . --check

  # Cross-compile every shipping binary (the Makefile `build-all` set) for
  # every supported platform, and upload them as release artifacts.
  #
  # Tags (and manual runs) only — 35 matrix jobs per commit is not worth paying
  # on every push and PR. Nothing consumes these artifacts continuously: the
  # extension repo builds its bundled ipm-rpc from ipm-tools *source* at a
  # pinned ref (vscode-ipm .github/workflows/build-vsix.yml), so between
  # releases they were uploaded and left to expire. Nor do they gate much: the
  # tree has no platform-specific code — no _windows.go/_darwin.go files, no
  # GOOS build tags, CGO_ENABLED=0 — so a target that compiles on linux
  # compiles everywhere, which the `test` job already proves.
  cross-compile:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    # Don't publish binaries for a tag that fails its own gates.
    needs: [test, gates]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All Go-only — no cgo, no platform build tags.
        target:
          - { goos: linux,   goarch: amd64 }
          - { goos: linux,   goarch: arm64 }
          - { goos: darwin,  goarch: amd64 }
          - { goos: darwin,  goarch: arm64 }
          - { goos: windows, goarch: amd64 }
        binary:
          - ipmt-parse
          - layout-gen
          - ipmsvg-gen
          - ipm-validate
          - md-embed
          - md-html
          - ipm-rpc
    steps:
      # fetch-depth: 0 so the tag is in the checkout. Go stamps the version a
      # binary reports from the VCS tag it can see, and a checkout without one
      # yields a v0.0.0-<time>-<sha> pseudo-version instead. A tag push happens
      # to bring its own tag, so this is belt-and-braces here — but the sibling
      # repo builds this same code at a pinned SHA, where the tag is genuinely
      # absent, and shipped exactly that pseudo-version in its 0.4.1.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Build ${{ matrix.binary }} for ${{ matrix.target.goos }}/${{ matrix.target.goarch }}
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          CGO_ENABLED: "0"
        run: |
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          mkdir -p out/$GOOS-$GOARCH
          go build -trimpath -ldflags='-s -w' \
            -o "out/$GOOS-$GOARCH/${{ matrix.binary }}$ext" \
            ./cmd/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ matrix.target.goos }}-${{ matrix.target.goarch }}
          path: out/${{ matrix.target.goos }}-${{ matrix.target.goarch }}/*
          if-no-files-found: error
          # Release artifacts, so keep them well past the 14 days that suited
          # throwaway per-push builds.
          retention-days: 90

  # A tag ships the WHOLE toolset, not one binary: every shipping command for
  # every platform, in one archive per platform. The VS Code extension does not
  # consume these — it builds ipm-rpc from source at the ref it pins — so this
  # exists for people who want the tools without a Go toolchain.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: write        # gh release create
      id-token: write        # provenance attestation
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, linux-arm64, darwin-amd64, darwin-arm64, windows-amd64]
    steps:
      # cross-compile uploads one artifact per (binary, platform); this pattern
      # regroups a platform's seven binaries back into a single directory.
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-${{ matrix.platform }}'
          merge-multiple: true
          path: stage
      - name: Archive ${{ matrix.platform }}
        run: |
          set -euo pipefail
          name="ipm-tools-${GITHUB_REF_NAME}-${{ matrix.platform }}"
          mkdir -p "dist/$name"
          cp stage/* "dist/$name/"
          # Artifact download drops the executable bit; restore it so the
          # archive is usable straight out of the box.
          chmod +x "dist/$name"/* || true
          count=$(ls -1 "dist/$name" | wc -l)
          [ "$count" -eq 7 ] || { echo "expected 7 binaries, got $count:"; ls -l "dist/$name"; exit 1; }
          # Ask a binary we can actually execute what version it thinks it is.
          # Counting files does not catch the failure that matters: a build
          # whose checkout had no tag reports a v0.0.0-<time>-<sha>
          # pseudo-version, exits 0, and ships looking perfectly healthy.
          if [ "${{ matrix.platform }}" = "linux-amd64" ]; then
            got=$("dist/$name/ipm-rpc" --version)
            [ "$got" = "ipm-rpc ${GITHUB_REF_NAME}" ] || {
              echo "version mismatch: expected \"ipm-rpc ${GITHUB_REF_NAME}\", got \"$got\""
              echo "the build did not see the tag — check fetch-depth on the cross-compile checkout"
              exit 1
            }
            echo "version check: $got"
          fi
          case "${{ matrix.platform }}" in
            windows-*) (cd dist && zip -qr "$name.zip" "$name") ;;
            *)         tar -C dist -czf "dist/$name.tar.gz" "$name" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 90

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Checkout FIRST. It cleans the workspace before it writes, so anything
      # downloaded ahead of it is deleted — which is exactly what happened to
      # v0.4.2: every archive was built and attested, then removed a step
      # before `gh release create`, which failed on "no matches found for
      # dist/*". Checked out at all for CHANGELOG.md: the release body is the
      # section written for this tag. --generate-notes produced only a "Full
      # Changelog" link here, because the history has no merged PRs to
      # summarise.
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Release notes from CHANGELOG.md
        run: go run ./cmd-dev/release-notes "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: 'release-*'
          merge-multiple: true
          path: dist
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      # Fail here rather than at `gh release create`, where an empty dist/
      # reads as a glob problem instead of a missing-artifacts one.
      - name: Every platform archive is present
        run: |
          set -euo pipefail
          count=$(ls -1 dist/ipm-tools-* | wc -l)
          [ "$count" -eq 5 ] || { echo "expected 5 archives in dist/, got $count:"; ls -l dist; exit 1; }
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/ipm-tools-*'
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
