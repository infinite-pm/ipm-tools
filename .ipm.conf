# infinite.pm toolchain config (read by md-embed and the ipm-rpc LSP server).
# Discovered by walking up to the repo root. Format: flat `key = value`,
# `#` starts a comment. See pkg/ipm/config.

# Markdown files md-embed must never scan, render, or rewrite — not even under
# --force or the editor's "Force Re-embed". Patterns match the repo-root-
# relative path; `*`,`?`,`[]` plus `**` (spans any number of path segments).
# Repeated lines accumulate. Everything listed here either has no committed
# diagrams or contains ipmt that is illustrative; the
# real diagram docs (docs/dev/layout-gen, how-to-model,
# ipmt-ex/{ipmt-examples,mark-ex}, ipm-parser-output) are
# NOT listed, so a repo-wide `md-embed --root . --force` re-renders only those.

# Test corpora — hundreds of parser/layout fixtures, never embedded.
embed-ignore = tests/**

# Tool docs — ipmt fences are syntax examples, not real diagrams.
embed-ignore = docs/md-embed.md, docs/md-html.md

# Language spec / reference. Their intentionally-invalid examples are now
# ```ipmt-invalid fences (skipped automatically), so these are listed only
# because we do not want their many valid examples committed as diagrams.
embed-ignore = docs/ipmt-spec.md, docs/ipmt-spec-ex.md, docs/ipmt-unresolved.md

# Example galleries / WIP / invalid-on-purpose — no committed diagrams.
embed-ignore = docs/ipmt-ex/ipmt-invalid.md
embed-ignore = docs/solver-examples/**
